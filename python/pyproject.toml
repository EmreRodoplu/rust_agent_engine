[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rust-agent-engine"
version = "0.2.7"
description = "High-performance autonomous agent engine powered by Rust and Python."
authors = [
    {name = "Emre Rodoplu", email = "emrerodoplu3@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0"
]

[tool.maturin]
module-name = "rust_agent_engine._rust_agent_engine"

[project.scripts]
rust-agent = "rust_agent_engine.cli:main"

[project.urls]
"Homepage" = "https://github.com/EmreRodoplu/rust_agent_engine"